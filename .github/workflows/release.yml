name: Package release

# GitHub's auto-generated "Source code" zip extracts to <repo>-<tag>, which is
# the wrong folder name for an Ashita addon and cannot be renamed. This builds
# a properly named zip and attaches it to the release instead.

on:
  push:
    tags:
      - 'v*'
  # Lets an existing tag be packaged after the fact, from the Actions tab or
  # with: gh workflow run "Package release" -f tag=v1.0.0
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to package, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # Needed so the annotated tag message is available for release notes.
          fetch-depth: 0

      - name: Build addon zip
        run: |
          mkdir -p dist/Deeps
          cp -r Deeps.lua README.md dist/Deeps/
          cd dist && zip -r ../Deeps.zip Deeps

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "Deeps.zip" --clobber
          else
            gh release create "$TAG" "Deeps.zip" \
              --title "Deeps $TAG" --notes-from-tag
          fi
